version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: classroom_iot_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: classroom_iot_user
      POSTGRES_PASSWORD: change_this_in_production
      POSTGRES_DB: classroom_iot_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_iot_user -d classroom_iot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    container_name: classroom_iot_web
    command: gunicorn --workers 4 --bind 0.0.0.0:8000 classroom_iot.wsgi:application
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: classroom_iot_user
      POSTGRES_PASSWORD: change_this_in_production
      POSTGRES_DB: classroom_iot_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: django-insecure-classroom-iot-dev-key-change-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*,127.0.0.1,localhost"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data: