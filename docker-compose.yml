version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: classroom_iot_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: classroom_iot_user
      POSTGRES_PASSWORD: change_this_in_production
      POSTGRES_DB: classroom_iot_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_iot_user -d classroom_iot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    container_name: classroom_iot_web
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_USER: classroom_iot_user
      POSTGRES_PASSWORD: change_this_in_production
      POSTGRES_DB: classroom_iot_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: django-insecure-classroom-iot-dev-key-change-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*, 127.0.0.1, localhost, 10.7.31.114"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: always
  nginx:
    image: nginx:alpine
    container_name: classroom_iot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data: