events {}

http {
    # Docker's embedded DNS server (standard on user-defined bridge
    # networks). Used below to force nginx to re-resolve the `web`
    # upstream at request time instead of caching whatever IP it had
    # when nginx started — a plain `proxy_pass http://web:8000;` only
    # resolves once, so every time the web container gets rebuilt and
    # recreated (getting a new internal IP), nginx would otherwise keep
    # trying to reach the old, dead IP until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 443 ssl;
        server_name 10.7.31.114;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        client_max_body_size 500M;

        # Serve media files directly
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Serve static files directly
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Proxy everything else to Django
        location / {
            # Using a variable (rather than a bare hostname) forces nginx
            # to go through the `resolver` above at request time, so it
            # picks up web's current IP instead of a cached, possibly
            # stale one.
            set $upstream_web http://web:8000;
            proxy_pass $upstream_web;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Recommended for long-lived streaming responses (MJPEG) —
            # HTTP/1.0 upstream connections (nginx's default) don't
            # handle chunked/streaming responses as reliably.
            proxy_http_version 1.1;

            # 3600s (1 hour) meant a live view open longer than that would
            # get silently cut off mid-class. Raised well past any
            # realistic session length; matches the backend's own
            # --timeout 0 (unlimited) for the same streaming endpoints.
            proxy_read_timeout       24h;
            proxy_connect_timeout    10s;
            proxy_send_timeout       24h;

            # Required for MJPEG streams — without this nginx buffers the
            # infinite multipart response until timeout, returning 502/500.
            proxy_buffering          off;
            proxy_cache              off;
            chunked_transfer_encoding on;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}